<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Meet our Team</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet" />
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
            crossorigin="anonymous" />
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="container">
            <header>
                <div class="row mt-12 text-center">
                    <div class="col-12 mb-12">
                        <h1 class="m-0">Meet our Team</h1>
                    </div>
                    <div class="col-12">
                        <p class="m-0">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Sequi maxime quos eaque
                            commodi hic odit asperiores officiis vel at officia animi inventore eum, velit cumque?
                            Commodi optio odio fugit vitae.</p>
                    </div>
                </div>
            </header>
            <main>
                <div class="row g-6 mt-12" id="team-list">
                    <!-- <div class="col md:col-6 xl:col-4">
                        <div class="card card-row">
                            <img class="card-img-start w-8 ratio-1x1 object-fit-cover" src="./img/male1.png" alt="" />
                            <div class="card-body p-0 ps-6 justify-content-center">
                                <h4 class="card-title text-uppercase">Marco Bianchi</h4>
                                <p class="card-text">Designer</p>
                                <p class="card-text fg-primary">marcobianchi@team.com</p>
                            </div>
                        </div>
                    </div> -->
                </div>
                <div class="row g-6 mt-12 justify-content-center">
                    <div class="col md:col-6 xl:col-4">
                        <header class="mb-6 col-auto">
                            <h2 class="card-title text-center">Add Team Member</h2>
                        </header>
                        <form id="form-add-member">
                            <div class="row mb-6">
                                <label for="inputName" class="col-3 col-form-label">Name</label>
                                <div class="col-9">
                                    <input type="text" class="form-control" id="inputName" placeholder="Name" required>
                                </div>
                            </div>
                            <div class="row mb-6">
                                <label for="inputRole" class="col-3 col-form-label">Role</label>
                                <div class="col-9">
                                    <input type="text" class="form-control" id="inputRole" placeholder="Role" required>
                                </div>
                            </div>
                            <div class="row mb-6">
                                <label for="inputEmail" class="col-3 col-form-label">Email</label>
                                <div class="col-9">
                                    <input type="email" class="form-control" id="inputEmail" placeholder="Email"
                                        required>
                                </div>
                            </div>
                            <div class="row mb-6">
                                <label for="inputImage" class="col-3 col-form-label">Image</label>
                                <div class="col-9">
                                    <!-- <input type="url" class="form-control" id="inputImage" required> -->
                                    <input type="text" class="form-control" id="inputImage" placeholder="img/Image"
                                        required>
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <button type="submit" class="btn-solid theme-primary col-auto">Add Member</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
        <script src="./script.js"></script>
    </body>

</html>
